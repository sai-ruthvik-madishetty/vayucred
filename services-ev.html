<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EV Fleet Solutions – VayuCred</title>
  <meta name="description" content="Earn carbon income from every kilometer your electric fleet drives.">
  <style>
  /* ===== Google Fonts ===== */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap');

  /* ===== CSS Custom Properties (Design Tokens) ===== */
  :root {
    --bg-primary: #050505;
    --text-primary: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.4);
    --border-color: rgba(255, 255, 255, 0.1);
    --card-bg: rgba(255, 255, 255, 0.02);
    --emerald-300: #6ee7b7;
    --emerald-400: #34d399;
    --emerald-500: #10b981;
    --emerald-600: #059669;
    --emerald-700: #047857;
    --teal-300: #5eead4;
    --blue-400: #60a5fa;
    --blue-500: #3b82f6;
    --blue-600: #2563eb;
    --red-400: #f87171;
    --red-500: #ef4444;
    --amber-400: #fbbf24;
    --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  html.light {
    --bg-primary: #ffffff;
    --text-primary: #050505;
    --text-muted: rgba(0, 0, 0, 0.5);
    --border-color: rgba(0, 0, 0, 0.12);
    --card-bg: rgba(0, 0, 0, 0.03);
    --shadow-color: rgba(0, 0, 0, 0.08);
  }

  /* ===== Light Mode Global Overrides ===== */
  /* Boost muted text contrast on light backgrounds */
  html.light .hero-desc,
  html.light .hero-note,
  html.light .section-subtitle,
  html.light .footer-brand p,
  html.light .footer-link,
  html.light .contact-desc,
  html.light .apply-hero p { opacity: 0.7 !important; }

  html.light .section-label,
  html.light .footer-heading,
  html.light .form-label,
  html.light .contact-label,
  html.light .field label { opacity: 0.6 !important; }

  /* Ensure SVG icons using currentColor are visible */
  html.light svg[stroke="currentColor"] { color: var(--text-primary); }

  /* Cards get subtle shadow in light mode for depth */
  html.light .card,
  html.light .step-card,
  html.light .value-card,
  html.light .calc-wrap,
  html.light .revenue-card,
  html.light .step-box,
  html.light .faq-item,
  html.light .about-stat-card,
  html.light .about-how-card,
  html.light .registry-item,
  html.light .contact-form-card {
    box-shadow: 0 2px 16px var(--shadow-color);
  }

  html.light .card:hover,
  html.light .step-card:hover,
  html.light .step-box:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.1); }

  /* Nav CTA stays dark on light bg */
  html.light .nav-cta { background: var(--emerald-600); color: #fff; }
  html.light .nav-cta:hover { background: var(--emerald-500); }

  /* Mobile drawer light */
  html.light .mobile-drawer { box-shadow: 20px 0 60px -15px rgba(0,0,0,0.1); }
  html.light .mobile-cta { color: #fff; }

  /* Social links in light mode */
  html.light .social-link { opacity: 0.7; }
  html.light .social-link:hover { opacity: 1; }

  /* Scroll to top button */
  html.light .scroll-top-btn { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  html.light .scroll-top-btn:hover { color: #fff; }

  /* Badge text more visible */
  html.light .badge-default { opacity: 0.7; }

  /* Form inputs */
  html.light .form-input,
  html.light .form-input-sm,
  html.light .form-textarea { background: rgba(0,0,0,0.02); border-color: rgba(0,0,0,0.15); }
  html.light .form-input:focus,
  html.light .form-textarea:focus { border-color: var(--emerald-500); }

  /* ===== Reset & Base ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }
  [id] { scroll-margin-top: 120px; }

  body {
    font-family: var(--font-sans);
    background: var(--bg-primary);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color 0.3s, color 0.3s;
    line-height: 1.6;
  }

  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  button { cursor: pointer; font-family: inherit; border: none; background: none; }
  input, textarea, select { font-family: inherit; }
  ul, ol { list-style: none; }

  ::selection { background: rgba(16, 185, 129, 0.3); }

  :focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px var(--emerald-500), 0 0 0 4px var(--bg-primary);
  }

  /* ===== Utility Classes ===== */
  .container { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; }
  .container-sm { max-width: 768px; margin: 0 auto; padding: 0 1.5rem; }
  .container-md { max-width: 1024px; margin: 0 auto; padding: 0 1.5rem; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .text-gradient {
    background: linear-gradient(to right, var(--emerald-400), var(--teal-300), var(--blue-400));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .bg-vayu { background: var(--bg-primary); }
  .text-vayu { color: var(--text-primary); }
  .bg-card { background: var(--card-bg); }
  .border-vayu { border-color: var(--border-color); }
  .text-emerald { color: var(--emerald-400); }

  /* ===== Navigation ===== */
  .nav {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
    padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
    transition: all 0.3s; border-bottom: 1px solid transparent;
  }
  .nav.scrolled {
    background: rgba(5,5,5,0.8); backdrop-filter: blur(20px);
    border-bottom-color: var(--border-color);
    box-shadow: 0 4px 30px rgba(0,0,0,0.3);
  }
  html.light .nav.scrolled { background: rgba(255,255,255,0.9); box-shadow: 0 2px 20px rgba(0,0,0,0.08); }

  .nav-logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.25rem; font-weight: 500; letter-spacing: -0.025em; }
  .nav-logo-icon {
    width: 2rem; height: 2rem; border-radius: 0.5rem; background: var(--emerald-500);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s; box-shadow: 0 4px 15px rgba(16,185,129,0.2);
  }
  .nav-logo:hover .nav-logo-icon { transform: rotate(12deg); }
  .nav-logo:hover span { color: var(--emerald-400); }
  .nav-logo span { transition: color 0.3s; }

  .nav-links { display: none; gap: 1.5rem; font-size: 0.875rem; font-weight: 300; align-items: center; }
  @media (min-width: 768px) { .nav-links { display: flex; } }

  .nav-link {
    opacity: 0.6; transition: all 0.3s; padding: 0.5rem 0; position: relative;
    display: flex; align-items: center; gap: 0.25rem; background: none; border: none;
    color: var(--text-primary); font-size: 0.875rem; font-weight: 300;
  }
  .nav-link:hover, .nav-link.active { opacity: 1; }
  .nav-link.active::after {
    content: ''; position: absolute; bottom: 0; left: 0; width: 100%;
    height: 2px; background: var(--emerald-400);
  }
  .nav-link.active { color: var(--emerald-400); }

  .nav-dropdown { position: relative; }
  .nav-dropdown-menu {
    position: absolute; top: 100%; left: 0; padding-top: 0.5rem;
    opacity: 0; visibility: hidden; transform: translateY(10px);
    transition: all 0.2s;
  }
  .nav-dropdown:hover .nav-dropdown-menu,
  .nav-dropdown:focus-within .nav-dropdown-menu {
    opacity: 1; visibility: visible; transform: translateY(0);
  }
  .nav-dropdown-inner {
    background: rgba(5,5,5,0.9); backdrop-filter: blur(20px);
    border: 1px solid var(--border-color); border-radius: 1rem;
    padding: 0.5rem; min-width: 200px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  html.light .nav-dropdown-inner { background: rgba(255,255,255,0.95); box-shadow: 0 10px 40px rgba(0,0,0,0.12); }
  .nav-dropdown-item {
    display: block; width: 100%; text-align: left; padding: 0.625rem 1rem;
    font-size: 0.8125rem; font-weight: 300; opacity: 0.6; border-radius: 0.75rem;
    transition: all 0.2s; color: var(--text-primary);
  }
  .nav-dropdown-item:hover { opacity: 1; color: var(--emerald-400); background: var(--card-bg); }

  .nav-cta {
    display: none; padding: 0.5rem 1.5rem; background: var(--emerald-500);
    color: #000; border-radius: 9999px; font-weight: 600; font-size: 0.75rem;
    transition: all 0.3s; box-shadow: 0 4px 15px rgba(16,185,129,0.1);
  }
  @media (min-width: 768px) { .nav-cta { display: block; } }
  .nav-cta:hover { background: var(--emerald-400); }
  .nav-cta:active { transform: scale(0.95); }

  .nav-actions { display: flex; align-items: center; gap: 1rem; margin-left: auto; }

  .theme-toggle {
    padding: 0.5rem; border-radius: 9999px; transition: all 0.3s;
    color: var(--emerald-500); background: none; border: none;
  }
  .theme-toggle:hover { background: var(--card-bg); }

  .menu-toggle { display: block; padding: 0.5rem; border-radius: 9999px; transition: all 0.3s; }
  @media (min-width: 768px) { .menu-toggle { display: none; } }
  .menu-toggle:hover { background: var(--card-bg); }

  /* ===== Mobile Menu ===== */
  .mobile-overlay {
    position: fixed; inset: 0; background: rgba(5,5,5,0.8); backdrop-filter: blur(4px);
    z-index: 100; opacity: 0; visibility: hidden; transition: all 0.3s;
  }
  .mobile-overlay.open { opacity: 1; visibility: visible; }
  html.light .mobile-overlay { background: rgba(0,0,0,0.3); }

  .mobile-drawer {
    position: fixed; top: 0; left: 0; height: 100%; width: 85%; max-width: 320px;
    background: var(--bg-primary); border-right: 1px solid var(--border-color);
    z-index: 101; display: flex; flex-direction: column;
    box-shadow: 20px 0 60px -15px rgba(0,0,0,0.5);
    transform: translateX(-100%); transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
  }
  .mobile-drawer.open { transform: translateX(0); }
  @media (min-width: 768px) { .mobile-drawer { display: none; } .mobile-overlay { display: none; } }

  .mobile-drawer-header {
    padding: 1.5rem; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border-color);
  }
  .mobile-drawer-content { flex: 1; overflow-y: auto; padding: 1.5rem 1rem; }
  .mobile-menu-item {
    display: flex; align-items: center; gap: 0.875rem; padding: 0.875rem;
    border-radius: 1rem; transition: all 0.2s; width: 100%; color: var(--text-primary);
    font-weight: 500; font-size: 0.9375rem; letter-spacing: -0.01em;
  }
  .mobile-menu-item:hover { background: var(--card-bg); }
  .mobile-menu-item svg { width: 1.25rem; height: 1.25rem; opacity: 0.4; }
  .mobile-menu-item:hover svg { opacity: 1; color: var(--emerald-400); }
  .mobile-menu-item span { opacity: 0.7; }
  .mobile-menu-item:hover span { opacity: 1; }

  .mobile-submenu-toggle {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 0.875rem; border-radius: 1rem; transition: all 0.2s;
    color: var(--text-primary);
  }
  .mobile-submenu-toggle.expanded { background: rgba(16,185,129,0.1); color: var(--emerald-400); }

  .mobile-submenu {
    max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
    margin-left: 0.5rem;
  }
  .mobile-submenu.expanded { max-height: 500px; }
  .mobile-submenu-inner {
    background: var(--card-bg); border: 1px solid var(--border-color);
    border-radius: 1rem; padding: 0.5rem; margin-top: 0.5rem;
  }
  .mobile-submenu-link {
    display: block; padding: 0.625rem 1rem; font-size: 0.8125rem; font-weight: 300;
    opacity: 0.5; border-radius: 0.75rem; transition: all 0.2s; color: var(--text-primary);
  }
  .mobile-submenu-link:hover { opacity: 1; color: var(--emerald-400); background: rgba(16,185,129,0.05); }

  .mobile-drawer-footer {
    padding: 1.5rem; border-top: 1px solid var(--border-color);
  }
  .mobile-cta {
    display: flex; align-items: center; justify-content: center; width: 100%;
    padding: 1rem; background: var(--emerald-500); color: #000; border-radius: 1rem;
    font-weight: 600; font-size: 0.875rem; transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(16,185,129,0.1);
  }
  .mobile-cta:hover { background: var(--emerald-400); }

  /* ===== Footer ===== */
  .footer {
    padding: 0; border-top: 1px solid var(--border-color);
    background: var(--bg-primary); position: relative; overflow: hidden;
  }

  /* Subtle gradient glow behind footer for depth */
  .footer::before {
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 60%; height: 1px;
    background: linear-gradient(to right, transparent, var(--emerald-500), transparent);
    opacity: 0.4;
  }

  /* --- Top Section: Main Grid --- */
  .footer-main {
    max-width: 1280px; margin: 0 auto; padding: 5rem 2rem 4rem;
    display: grid; grid-template-columns: 1fr; gap: 3rem;
  }
  @media (min-width: 768px) {
    .footer-main { grid-template-columns: 2.5fr 1fr 1fr 1.5fr; gap: 2rem; }
  }

  /* Brand Column */
  .footer-brand {}
  .footer-brand-logo {
    display: flex; align-items: center; gap: 0.625rem;
    margin-bottom: 1.5rem;
  }
  .footer-brand-icon {
    width: 2.25rem; height: 2.25rem; border-radius: 0.625rem;
    background: var(--emerald-500); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 15px rgba(16,185,129,0.25); transition: transform 0.3s;
  }
  .footer-brand-logo:hover .footer-brand-icon { transform: rotate(12deg); }
  .footer-brand-icon svg { width: 1.25rem; height: 1.25rem; color: #000; }

  .footer-brand-name {
    font-size: 1.375rem; font-weight: 600; letter-spacing: -0.03em;
    color: var(--text-primary);
  }

  .footer-brand-desc {
    font-size: 0.875rem; font-weight: 300; line-height: 1.8;
    opacity: 0.55; max-width: 22rem; margin-bottom: 2rem;
  }
  html.light .footer-brand-desc { opacity: 0.65; }

  /* Social Icons Row */
  .footer-socials {
    display: flex; align-items: center; gap: 0.75rem;
  }
  .footer-social-link {
    width: 2.5rem; height: 2.5rem; border-radius: 0.75rem;
    display: flex; align-items: center; justify-content: center;
    background: var(--card-bg); border: 1px solid var(--border-color);
    color: var(--text-primary); opacity: 0.5;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .footer-social-link:hover {
    opacity: 1; transform: translateY(-3px) scale(1.05);
    box-shadow: 0 8px 24px rgba(16,185,129,0.2);
  }

  /* Twitter/X icon hover — VayuCred teal */
  .footer-social-link[aria-label="Twitter"]:hover,
  .footer-social-link[aria-label="X"]:hover {
    background: rgba(16,185,129,0.12); border-color: var(--emerald-400);
    color: var(--emerald-400);
  }

  /* LinkedIn icon hover — VayuCred blue accent */
  .footer-social-link[aria-label="LinkedIn"]:hover {
    background: rgba(96,165,250,0.12); border-color: var(--blue-400);
    color: var(--blue-400);
  }

  .footer-social-link svg { width: 1.125rem; height: 1.125rem; }

  /* Light mode social adjustments */
  html.light .footer-social-link {
    opacity: 0.6; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  html.light .footer-social-link:hover { opacity: 1; }

  /* Link Columns */
  .footer-col {}
  .footer-heading {
    font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.25em;
    font-weight: 700; margin-bottom: 1.25rem; opacity: 0.35;
    color: var(--text-primary);
  }
  html.light .footer-heading { opacity: 0.5; }

  .footer-links { display: flex; flex-direction: column; gap: 0.875rem; }
  .footer-link {
    font-size: 0.875rem; font-weight: 400; opacity: 0.55;
    transition: all 0.25s; position: relative; display: inline-block; width: fit-content;
    color: var(--text-primary);
  }
  .footer-link::after {
    content: ''; position: absolute; bottom: -2px; left: 0;
    width: 0; height: 1px; background: var(--emerald-400);
    transition: width 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .footer-link:hover { opacity: 1; color: var(--emerald-400); }
  .footer-link:hover::after { width: 100%; }

  html.light .footer-link { opacity: 0.65; }
  html.light .footer-link:hover { opacity: 1; }

  /* Newsletter / CTA Column */
  .footer-cta-col {}
  .footer-cta-title {
    font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.25em;
    font-weight: 700; margin-bottom: 1.25rem; opacity: 0.35;
    color: var(--text-primary);
  }
  html.light .footer-cta-title { opacity: 0.5; }

  .footer-cta-text {
    font-size: 0.8125rem; font-weight: 300; opacity: 0.5;
    line-height: 1.7; margin-bottom: 1.5rem;
  }
  html.light .footer-cta-text { opacity: 0.6; }

  .footer-cta-btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.75rem 1.5rem; border-radius: 9999px;
    background: var(--emerald-500); color: #000;
    font-weight: 700; font-size: 0.75rem; letter-spacing: 0.02em;
    transition: all 0.3s; border: none;
    box-shadow: 0 4px 15px rgba(16,185,129,0.15);
  }
  .footer-cta-btn:hover {
    background: var(--emerald-400);
    box-shadow: 0 8px 25px rgba(16,185,129,0.25);
    transform: translateY(-1px);
  }
  .footer-cta-btn:active { transform: scale(0.97) translateY(0); }
  .footer-cta-btn svg { width: 1rem; height: 1rem; }

  html.light .footer-cta-btn { color: #fff; background: var(--emerald-600); }
  html.light .footer-cta-btn:hover { background: var(--emerald-500); }

  /* --- Bottom Bar: Copyright --- */
  .footer-bottom-bar {
    max-width: 1280px; margin: 0 auto;
    padding: 2rem 2rem; border-top: 1px solid var(--border-color);
    display: flex; flex-direction: column; gap: 1rem;
    align-items: center; justify-content: space-between;
  }
  @media (min-width: 768px) { .footer-bottom-bar { flex-direction: row; } }

  .footer-copyright {
    display: flex; align-items: center; gap: 0.75rem;
    font-size: 0.75rem; font-weight: 400; letter-spacing: 0.04em;
    opacity: 0.4; color: var(--text-primary);
  }
  html.light .footer-copyright { opacity: 0.5; }

  /* Decorative diamond separator between copyright items */
  .footer-dot {
    width: 4px; height: 4px; border-radius: 1px; transform: rotate(45deg);
    background: var(--emerald-500); opacity: 0.6; flex-shrink: 0;
  }

  .footer-tagline {
    font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.15em;
    text-transform: uppercase; opacity: 0.25; color: var(--text-primary);
  }
  html.light .footer-tagline { opacity: 0.35; }

  /* ===== Scroll to Top ===== */
  .scroll-top-btn {
    position: fixed; bottom: 2rem; right: 2rem; z-index: 40;
    width: 3rem; height: 3rem; border-radius: 9999px;
    background: var(--card-bg); border: 1px solid var(--border-color);
    backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transform: translateY(20px);
    transition: all 0.3s; color: var(--emerald-400);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .scroll-top-btn.visible { opacity: 1; visibility: visible; transform: translateY(0); }
  .scroll-top-btn:hover {
    background: var(--emerald-500); color: #000;
    box-shadow: 0 8px 32px rgba(16,185,129,0.3);
  }

  /* ===== Common Components ===== */
  .section { padding: 8rem 1.5rem; }
  .section-border { border-top: 1px solid var(--border-color); }

  .badge {
    display: inline-block; padding: 0.375rem 1rem; border-radius: 9999px;
    font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.25em; font-weight: 700;
  }
  .badge-emerald { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: var(--emerald-400); }
  .badge-default { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); opacity: 0.5; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    padding: 1.25rem 2.5rem; border-radius: 9999px; font-weight: 700;
    font-size: 0.875rem; transition: all 0.3s; border: none;
  }
  .btn:active { transform: scale(0.95); }

  .btn-primary { background: var(--emerald-500); color: #000; }
  .btn-primary:hover { background: var(--emerald-400); }

  .btn-secondary {
    background: var(--card-bg); color: var(--text-primary);
    border: 1px solid var(--border-color); backdrop-filter: blur(12px);
  }
  .btn-secondary:hover { opacity: 0.8; }

  .btn-outline {
    background: transparent; color: var(--emerald-400);
    border: 1px solid rgba(16,185,129,0.2); background: rgba(16,185,129,0.05);
  }
  .btn-outline:hover { background: rgba(16,185,129,0.1); }

  .btn-sm { padding: 0.75rem 1.5rem; font-size: 0.75rem; }
  .btn-lg { padding: 1.25rem 2.5rem; font-size: 1rem; }
  .btn-block { width: 100%; }

  .card {
    padding: 2rem; border-radius: 1.5rem;
    background: var(--card-bg); border: 1px solid var(--border-color);
    transition: all 0.3s;
  }
  .card-lg { padding: 2.5rem; border-radius: 3rem; }
  .card:hover { border-color: rgba(16,185,129,0.2); }

  .section-label {

  /* Input styles */
  .form-label {
    display: block; font-size: 0.75rem; text-transform: uppercase;

  .form-input-sm {

    padding: 1rem 1.5rem;

  .form-input-sm::placeholder { color: var(--text-muted); }

  .form-textarea {

  /* ===== Animations ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes pulse-glow {

  @keyframes float {

  @keyframes shimmer {

    100% { transform: translateX(200%); }

    50% { opacity: 1; transform: scale(1.04); }

  .animate-shimmer { animation: shimmer 6s linear infinite; }

  .delay-100 { animation-delay: 0.1s; }
  .delay-200 { animation-delay: 0.2s; }
  .delay-300 { animation-delay: 0.3s; }
  .delay-400 { animation-delay: 0.4s; }

  .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.8s cubic-bezier(0.21,0.47,0.32,0.98), transform 0.8s cubic-bezier(0.21,0.47,0.32,0.98); }

  // ===== Theme Management =====
  function initTheme() {
    const saved = localStorage.getItem('vayucred-theme') || 'dark';
    applyTheme(saved);
  }

  function applyTheme(theme) {
    document.documentElement.classList.remove('light', 'dark');
    document.documentElement.classList.add(theme);
    localStorage.setItem('vayucred-theme', theme);
    updateThemeIcons(theme);
  }

  function toggleTheme() {
    const current = localStorage.getItem('vayucred-theme') || 'dark';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  }

  function updateThemeIcons(theme) {
    document.querySelectorAll('.theme-toggle').forEach(btn => {
      btn.innerHTML = theme === 'dark' ? Icons.sun : Icons.moon;
    });
  }

  // ===== Navigation =====
  function initNavigation() {
    const nav = document.querySelector('.nav');
    if (!nav) return;

    // Scroll effect
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 20);
    });
    // Initial check
    nav.classList.toggle('scrolled', window.scrollY > 20);

    // Active link highlighting
    const currentPath = window.location.pathname;
    nav.querySelectorAll('.nav-link').forEach(link => {
      const href = link.getAttribute('href') || link.dataset.href;
      if (href === currentPath || (currentPath === '/index.html' && href === '/')) {
        link.classList.add('active');
      }
    });
  }

  // ===== Mobile Menu =====
  function initMobileMenu() {
    const overlay = document.querySelector('.mobile-overlay');
    const drawer = document.querySelector('.mobile-drawer');
    const openBtn = document.querySelector('.menu-toggle');
    const closeBtns = document.querySelectorAll('.mobile-close');

    if (!overlay || !drawer || !openBtn) return;

    function openMenu() {
      overlay.classList.add('open');
      drawer.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      overlay.classList.remove('open');
      drawer.classList.remove('open');
      document.body.style.overflow = '';
    }

    openBtn.addEventListener('click', openMenu);
    overlay.addEventListener('click', closeMenu);
    closeBtns.forEach(btn => btn.addEventListener('click', closeMenu));

    // Close on link click
    drawer.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', closeMenu);
    });

    // Submenu toggles
    drawer.querySelectorAll('.mobile-submenu-toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const submenu = toggle.nextElementSibling;
        toggle.classList.toggle('expanded');
        submenu.classList.toggle('expanded');
      });
    });

    // Escape key
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeMenu();
    });
  }

  // ===== Scroll to Top =====
  function initScrollToTop() {
    const btn = document.querySelector('.scroll-top-btn');
    if (!btn) return;

    window.addEventListener('scroll', () => {
      btn.classList.toggle('visible', window.scrollY > 400);
    });

    btn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // ===== Intersection Observer for Reveal Animations =====
  function initRevealAnimations() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const delay = entry.target.dataset.delay || 0;
          setTimeout(() => {
            entry.target.classList.add('visible');
          }, delay * 1000);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '-100px' });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  }

  // ===== Smooth Anchor Scrolling =====
  function initSmoothAnchors() {
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', (e) => {
        const id = anchor.getAttribute('href').substring(1);
        const target = document.getElementById(id);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });
  }

  // ===== Generate Footer HTML =====

    // Inject scroll-to-top

    const style = document.createElement('style');
    style.textContent = `

      @media (max-width: 767px) { .nav-links { display: none !important; } .mobile-only-controls { display: flex !important; } }

    initNavigation();
    initMobileMenu();
    initScrollToTop();
